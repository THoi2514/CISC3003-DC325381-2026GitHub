<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Share Your Travels</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="cisc3003-practice04.css">
</head>
<body>

<header>
    <h1>Share Your Travels</h1>
    <p>let us know where you've been</p>
</header>

<div class="container">
    <h2>PHOTO DETAILS</h2>

    <form action="#" method="post">
        <table class="form-table">
            <!-- Title -->
            <tr>
                <td colspan="2">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="Give your photo a descriptive name">
                </td>
            </tr>

            <!-- Description -->
            <tr>
                <td colspan="2">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="5" cols="61" placeholder="Adding a rich description will help with search results"></textarea>
                </td>
            </tr>

            <!-- Continent + Copyright/CC (right column spans 3 rows) -->
            <tr>
                <td>
                    <label for="continent">Continent</label>
                    <select id="continent" name="continent">
                        <option value="">Choose continent</option>
                        <option value="Africa">Africa</option>
                        <option value="Asia">Asia</option>
                        <option value="Europe">Europe</option>
                        <option value="North America">North America</option>
                        <option value="South America">South America</option>
                    </select>
                </td>
                <td rowspan="3">
                    <div class="copyright-box">
                        <label>Copyright?</label>
                        <input type="radio" name="copyright" value="all" checked> All rights reserved<br>
                        <input type="radio" name="copyright" value="cc"> Creative Commons
                    </div>
                    <div class="cc-types">
                        <label>Creative Commons Types</label>
                        <input type="checkbox" name="cc[]" value="1"> Attribution<br>
                        <input type="checkbox" name="cc[]" value="2"> Noncommercial<br>
                        <input type="checkbox" name="cc[]" value="3"> No Derivative Works
                    </div>
                </td>
            </tr>

            <!-- Country -->
            <tr>
                <td>
                    <label for="country">Country</label>
                    <select id="country" name="country">
                        <option value="">Choose country</option>
                        <option value="Canada">Canada</option>
                        <option value="Mexico">Mexico</option>
                        <option value="United States">United States</option>
                    </select>
                </td>
            </tr>

            <!-- City -->
            <tr>
                <td>
                    <label for="city">City</label>
                    <select id="city" name="city">
                        <option value="">Choose city</option>
                        <option value="Calgary">Calgary</option>
                        <option value="Montreal">Montreal</option>
                        <option value="Toronto">Toronto</option>
                        <option value="Vancouver">Vancouver</option>
                    </select>
                </td>
            </tr>

            <!-- License acceptance -->
            <tr>
                <td colspan="2">
                    <label>
                        <input type="checkbox" name="accept"> I accept the software license
                    </label>
                </td>
            </tr>

            <!-- Rate + Date/Time (right column spans 2 rows) -->
            <tr>
                <td>
                    <label for="rate">Rate this photo:</label>
                    <input type="number" id="rate" name="rate" min="1" max="5">
                </td>
                <td rowspan="2" class="datetime-box">
                    <label>Date Taken:</label>
                    <input type="date" id="date" name="date"><br><br>
                    <label>Time Taken:</label>
                    <input type="time" id="time" name="time">
                </td>
            </tr>

            <!-- Color -->
            <tr>
                <td>
                    <label for="color">Color Collection:</label>
                    <input type="color" id="color" name="color" value="oklab(50% 0.1 0.1 / 0.5)">
                </td>
            </tr>

            <!-- Buttons -->
            <tr>
                <td colspan="2" class="button-bar">
                    <input type="submit" value="送出查詢" class="rounded">
                    <input type="reset" value="Clear Form" class="rounded">
                </td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
